# Eclipse Mosquitto configuration for the local UNS broker (docs/UNS_OPERATING_MODEL.md).
#
#   mosquitto -c uns/mosquitto.conf                 (uns/broker.py substitutes the port for tests)
#   docker run -p 1883:1883 -v "$PWD/uns/mosquitto.conf:/mosquitto/config/mosquitto.conf" eclipse-mosquitto
#     (in Docker, change the listener address to 0.0.0.0)
#
# Local development only: anonymous access, loopback listener, no TLS.

listener 1883 127.0.0.1
allow_anonymous true

# Retained state is not persisted by the broker: after a broker restart the UNS publisher republishes
# every retained topic on reconnect (docs/UNS_MQTT_SEMANTICS.md, "Reconnect"). Persisting would risk
# serving retained state from a finished run.
persistence false

# Do not drop messages for slow subscribers (a benchmark stream must be complete).
max_queued_messages 0
max_inflight_messages 20

log_type error
log_dest stderr
